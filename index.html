    <!-- Anti-cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Force Update Script -->
    <script>
      (function() {
        const VERSION_KEY = 'lovable_app_version';
        
        async function forceUpdate() {
          console.log('[VersionCheck] New version detected, clearing cache and reloading...');
          
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let r of regs) {
              try {
                r.active?.postMessage({ type: 'CLEAR_CACHES' });
                await r.update();
              } catch (e) {
                console.warn('[VersionCheck] Service Worker update failed', e);
              }
            }
          }
          
          if ('caches' in window) {
            const keys = await caches.keys();
            for (let k of keys) await caches.delete(k);
          }
          
          // Preservar apenas tokens de autenticação essenciais
          const authKeysToKeep = ['sb-iemalzlfnbouobyjwlwi-auth-token', 'impersonate_session'];
          const keysToRemove = [];
          
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && !authKeysToKeep.some(authKey => key.includes(authKey))) {
              keysToRemove.push(key);
            }
          }
          keysToRemove.forEach(k => localStorage.removeItem(k));
          
          const sessionKeysToRemove = [];
          for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if (key && !authKeysToKeep.some(authKey => key.includes(authKey))) {
              sessionKeysToRemove.push(key);
            }
          }
          sessionKeysToRemove.forEach(k => sessionStorage.removeItem(k));
          
          // Use a timestamp to bypass any server-side or ISP caching
          const url = new URL(window.location.href);
          url.searchParams.set('v_refresh', Date.now());
          window.location.replace(url.toString());
        }

        async function checkVersion() {
          try {
            const response = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
            if (!response.ok) return;
            
            const data = await response.json();
            const currentVersion = localStorage.getItem(VERSION_KEY);
            
            if (currentVersion && currentVersion !== data.version) {
              localStorage.setItem(VERSION_KEY, data.version);
              await forceUpdate();
            } else if (!currentVersion) {
              localStorage.setItem(VERSION_KEY, data.version);
            }
          } catch (e) {
            console.warn('[VersionCheck] Failed to check version', e);
          }
        }

        checkVersion();
      })();
    </script>
